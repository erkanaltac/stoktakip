<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gelişmiş Stok ve Saha Takip Sistemi</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- İkonlar -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Dışa Aktarma Kütüphaneleri -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>

  <style>
    /* ===== Stok Takip (Apps Script) sürümüyle aynı koyu tema ===== */
    body { background-color:#0f172a; color:#e2e8f0; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; font-size:14px; }
    .gizli { display:none !important; }
    .card { background-color:rgba(30,41,59,.5); border:1px solid #1e293b; border-radius:.6rem; padding:1rem; margin-bottom:.9rem; }
    .card h3 { font-size:13px; color:#94a3b8; font-weight:700; margin:0 0 .6rem; }
    .btn { padding:.45rem .9rem; border-radius:.4rem; font-weight:600; cursor:pointer; transition:all .15s; font-size:13px; border:none; }
    .btn-blue { background-color:#0d9488; color:#fff; } .btn-blue:hover { background-color:#14b8a6; }
    .btn-red { background-color:#7f1d1d; color:#fca5a5; border:1px solid #991b1b; } .btn-red:hover { background-color:#991b1b; color:#fff; }
    .btn-green { background-color:#0d9488; color:#fff; } .btn-green:hover { background-color:#14b8a6; }
    .btn-gray { background-color:#1e293b; color:#94a3b8; border:1px solid #334155; } .btn-gray:hover { color:#e2e8f0; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .tab-btn { padding:.5rem 1rem; border-bottom:2px solid transparent; cursor:pointer; font-size:12px; color:#64748b; }
    .tab-btn.aktif { border-bottom-color:#2dd4bf; color:#2dd4bf; font-weight:700; }
    .bolge-btn { padding:.5rem 1rem; border-radius:.4rem; font-size:12px; cursor:pointer; background:#111827; border:1px solid #334155; color:#94a3b8; }
    .bolge-btn.aktif { border-color:#2dd4bf; color:#2dd4bf; background:rgba(45,212,191,.1); }
    table { width:100%; text-align:left; border-collapse:collapse; margin-top:.4rem; font-size:12px; }
    th { padding:.4rem; border-bottom:1px solid #334155; color:#64748b; font-size:10px; text-transform:uppercase; background:#111827; }
    td { padding:.45rem; border-bottom:1px solid #1e293b; vertical-align:middle; word-break:break-word; }
    tr:nth-child(even) td { background:rgba(30,41,59,.3); }
    input, select, textarea { width:100%; padding:.4rem .55rem; border-radius:.4rem; background-color:#0f172a; border:1px solid #334155; color:#fbbf24; margin-bottom:0; font-size:13px; }
    select { color:#e2e8f0; }
    input[type=date] { color-scheme:dark; }
    input[type=checkbox] { width:auto; }
    label.f { display:block; font-size:11px; color:#64748b; margin-bottom:3px; }
    .grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:.6rem; }
    .badge { font-size:10px; padding:2px 6px; border-radius:4px; border:1px solid; white-space:nowrap; }
    .b-ok { color:#6ee7b7; background:rgba(6,78,59,.4); border-color:#065f46; }
    .b-az { color:#fcd34d; background:rgba(120,53,15,.4); border-color:#78350f; }
    .b-yok { color:#fca5a5; background:rgba(127,29,29,.4); border-color:#7f1d1d; }
    .chip { display:inline-flex; align-items:center; gap:5px; background:rgba(45,212,191,.12); border:1px solid #0d9488; color:#5eead4; border-radius:14px; padding:4px 6px 4px 10px; font-size:11px; ma[...]
    .chip .x { cursor:pointer; font-weight:700; color:#f87171; padding:0 4px; }
    .suggest-wrap { position:relative; }
    .suggest-list { position:absolute; z-index:30; top:100%; left:0; right:0; background:#111827; border:1px solid #334155; border-radius:6px; margin-top:2px; max-height:180px; overflow-y:auto; di[...]
    .suggest-list .it { padding:6px 8px; font-size:12px; cursor:pointer; color:#cbd5e1; }
    .suggest-list .it:hover { background:rgba(45,212,191,.15); color:#5eead4; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:100; align-items:center; justify-content:center; padding:16px; }
    .modal-box { background:#111827; border:1px solid #334155; border-radius:10px; max-width:560px; width:100%; max-height:88vh; overflow:auto; padding:16px; }
    .mini-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200; align-items:center; justify-content:center; padding:16px; }
    .mini-box { background:#111827; border:1px solid #334155; border-radius:10px; max-width:380px; width:100%; padding:16px; }
    .toast-box { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#1e293b; border:1px solid #0d9488; color:#5eead4; font-size:12px; padding:8px 14px; border-radius:8px; di[...]
    .muted { color:#64748b; font-size:11px; text-align:center; padding:16px; }
    .icon-btn { background:#1e293b; border:1px solid #334155; color:#94a3b8; border-radius:6px; width:28px; height:28px; font-size:12px; cursor:pointer; }
    .icon-btn:hover { color:#e2e8f0; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .ariza-item, .kamera-row { padding:8px; border-top:1px solid #1e293b; cursor:pointer; }
    .ariza-item:first-child, .kamera-row:first-child { border-top:none; }
    .ariza-item:hover, .kamera-row:hover { background:rgba(30,41,59,.4); }
    .parca-check-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid #1e293b; font-size:13px; cursor:pointer; }
    .parca-check-row:first-child { border-top:none; }
    .dash-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; }
    .dash-card { background:#0f172a; border:1px solid #1e293b; border-radius:8px; padding:10px; text-align:center; }
    .dash-card .num { font-size:20px; font-weight:700; } .dash-card .lbl { font-size:10px; color:#64748b; }
    .card.text-center { background:#1e293b; border:1px solid #334155; }
    @media (max-width:640px) {
      .two-col { grid-template-columns:1fr; }
      table { font-size:10px; } th, td { padding:.3rem; }
      .hide-mobile { display:none; }
      input, select, textarea { font-size:16px !important; padding:.55rem .5rem; }
    }
  </style>
</head>
<body>

  <!-- ================= L O G I N   E K R A N I (değiştirilmedi) ================= -->
  <div id="login-ekrani" class="flex items-center justify-center min-h-screen">
    <div class="card w-96 text-center shadow-lg">
      <h2 class="text-2xl font-bold mb-6"><i class="fa-solid fa-bolt text-yellow-400"></i> Sistem Girişi</h2>

      <input type="text" id="login-kullanici" placeholder="Kullanıcı Adı" class="mb-4">
      <input type="password" id="login-sifre" placeholder="Şifre" class="mb-2">

      <div class="flex items-center justify-between mb-6 text-sm">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" id="login-hatirla" class="mr-2 w-4 h-4"> Beni Hatırla
        </label>
        <a href="#" onclick="sifremiUnuttum()" class="text-blue-400 hover:underline">Şifremi Unuttum</a>
      </div>

      <button onclick="girisYap()" class="btn btn-blue w-full mb-2">Giriş Yap</button>
      <p id="login-hata" class="text-red-400 text-sm gizli mt-2"></p>
    </div>
  </div>

  <!-- ================= A N A   U Y G U L A M A ================= -->
  <div id="ana-ekran" class="gizli min-h-screen flex flex-col">

    <header class="bg-gray-800 p-3 flex justify-between items-center border-b border-gray-700 sticky top-0" style="z-index:5">
      <div class="text-lg font-bold cursor-pointer" onclick="anaMenuyuGoster()">
        <i class="fa-solid fa-house"></i> <span class="hide-mobile">Ana Menü</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="kullanici-bilgisi" class="text-gray-300 text-xs font-bold uppercase"></span>
        <button onclick="ekranGoster('ayarlar-modulu')" class="btn btn-gray"><i class="fa-solid fa-gear"></i> <span class="hide-mobile">Ayarlar</span></button>
        <button onclick="cikisYap()" class="btn btn-red"><i class="fa-solid fa-right-from-bracket"></i> <span class="hide-mobile">Çıkış</span></button>
      </div>
    </header>

    <!-- Ana Menü -->
    <div id="dashboard" class="p-4 grid grid-cols-2 md:grid-cols-4 gap-4 max-w-5xl mx-auto w-full mt-6">
      <div id="btn-kullanim" onclick="ekranGoster('kullanim-modulu')" class="card text-center cursor-pointer hover:bg-gray-700 transition">
        <i class="fa-solid fa-clipboard-list text-3xl text-blue-400 mb-2"></i><h3 class="text-base font-bold">Kullanım Girişi</h3>
      </div>
      <div id="btn-ariza" onclick="ekranGoster('ariza-modulu')" class="card text-center cursor-pointer hover:bg-gray-700 transition">
        <i class="fa-solid fa-triangle-exclamation text-3xl text-red-400 mb-2"></i><h3 class="text-base font-bold">Arıza</h3>
      </div>
      <div id="btn-kamera" onclick="ekranGoster('kamera-modulu')" class="card text-center cursor-pointer hover:bg-gray-700 transition">
        <i class="fa-solid fa-video text-3xl text-green-400 mb-2"></i><h3 class="text-base font-bold">Kamera</h3>
      </div>
      <div id="btn-depo" onclick="ekranGoster('depo-modulu')" class="card text-center cursor-pointer hover:bg-gray-700 transition">
        <i class="fa-solid fa-boxes-stacked text-3xl text-yellow-400 mb-2"></i><h3 class="text-base font-bold">Depo</h3>
      </div>
    </div>

    <!-- rest of the file unchanged... -->
  </div>

  <div class="toast-box" id="toast"></div>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="flex justify-between items-center mb-3"><h3 id="modalTitle" class="font-bold text-sm"></h3><button class="btn btn-gray" onclick="closeModal()">Kapat</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="mini-overlay" id="miniOverlay">
    <div class="mini-box"><div id="miniTitle" class="font-bold text-sm mb-3"></div><div id="miniBody"></div></div>
  </div>

  <script>
    // =====================================================================

      // throw new Error('Missing Firebase configuration');
    }

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let seciliBolge = null;

    function detachListeners(){ aktifListeners.forEach(u=>{ try{u();}catch(e){} }); aktifListeners=[]; }

    // ... rest of original JS unchanged (kept as before)
  </script>
</body>
</html>
